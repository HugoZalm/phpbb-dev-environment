
services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./phpbb:/var/www/html
      - ${EXTENSIONS_PATH:-../extensions}:/var/www/html/ext-external
    command: >
      bash -c "
        if [ -d /var/www/html/ext-external ]; then
          for vendor in /var/www/html/ext-external/*; do
            [ -d \"$$vendor\" ] || continue
            vendorname=$$(basename \"$$vendor\")
            for ext in \"$$vendor\"/*; do
              [ -d \"$$ext\" ] || continue
              extname=$$(basename \"$$ext\")
              mkdir -p /var/www/html/ext/$$vendorname
              target=/var/www/html/ext/$$vendorname/$$extname
              if [ -d \"$$target\" ] && [ ! -L \"$$target\" ]; then echo \"Replacing real directory $$target with a symlink\"; rm -rf \"$$target\"; fi
              ln -sfn \"$$ext\" \"$$target\"
            done
          done
        fi
        apache2-foreground
      "
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: phpbb
      MARIADB_USER: phpbb
      MARIADB_PASSWORD: devpassword
      MARIADB_ROOT_PASSWORD: devrootpassword
    volumes:
      - phpBB_dev_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  phpBB_dev_db_data:
